include /home/seba/.config/kitty/themes/catppuccin-mocha.conf

font_family      monospace
font_size        12.0
shell fish
window_margin_width  0
window_padding_width 8
confirm_os_window_close 0

# --- Zoom con teclado normal ---

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# --- Zoom con el Pad Numérico ---
map ctrl+kp_add      change_font_size all +1.0
map ctrl+kp_subtract change_font_size all -1.0

map ctrl+shift+a launch --stdin-source=@screen_scrollback --type=background wl-copy
